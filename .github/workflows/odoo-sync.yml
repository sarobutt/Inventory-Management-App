name: Odoo stock sync

# Each run syncs every 2 minutes for ~5.5 hours, then starts the next run itself,
# so the sync keeps going around the clock without relying on GitHub's schedule.
# The schedule below is only a backup that restarts the chain if it ever stops.
# To stop syncing completely: GitHub -> Actions -> "Odoo stock sync" -> ... -> Disable workflow
# (or turn "Sync with the Odoo till" off in the app).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

# Never run two syncs at the same time.
concurrency:
  group: odoo-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets a run start the next one

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Sync Odoo <-> Firestore (every 2 min for ~5.5 hours)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          SYNC_LOOP_MINUTES: "330"
          SYNC_INTERVAL_SECONDS: "120"
        run: python sync/odoo_sync.py
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run odoo-sync.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
