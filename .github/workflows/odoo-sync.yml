name: Odoo stock sync

# Runs every 5 minutes (GitHub may delay scheduled runs a little when busy).
# You can also run it by hand: GitHub -> Actions -> "Odoo stock sync" -> Run workflow.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two syncs at the same time.
concurrency:
  group: odoo-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Sync Odoo <-> Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python sync/odoo_sync.py
