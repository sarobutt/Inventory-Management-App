name: company_products
description: Manage companies and their products, stored in Firebase Cloud Firestore.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # firebase_core and cloud_firestore are added with:
  #   flutter pub add firebase_core cloud_firestore
  # (so you always get versions that match your Flutter install)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
